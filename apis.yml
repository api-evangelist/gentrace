aid: gentrace
name: Gentrace
description: >-
  Gentrace was a developer platform for evaluating and testing LLM and AI
  applications ("evals as infrastructure"). It provided pipelines, datasets,
  experiments, and test cases so teams could run offline and online
  evaluations, grade model outputs, track regressions, and observe AI features
  in production via OpenTelemetry-based instrumentation. The platform shipped a
  REST API (v4) secured with bearer API keys, first-party Python and
  TypeScript/Node SDKs, and a documented object model of pipelines, datasets,
  experiments, and test cases. Gentrace was based in San Francisco and backed
  by Matrix Partners. The company has since shut down its hosted product, but
  its OpenAPI specification, SDK packages, and documentation mirror remain
  publicly available.
